kind: component
id: cross-refs
name: CrossRefs
description: A plain wrapper that styles a list of slotted links in monospace — used below a definition's description to list the other schema definitions it references.

metadata:
  tags: [schema-reference, navigation]
  status: {status: stable}

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - level: should
        statement: Use once below a definition's description to list the other definitions it references. Not a general-purpose link list — for a link inline within running prose or a property's own type, use type-ref instead.
        alternatives:
          - to: type-ref
        checkedBy: manual

  - kind: guidelines
    for: all
    items:
      - level: must
        statement: Slot plain anchor elements, not ds-type-ref — this component only styles the links it's given; it does not render its own link markup or resolve targets.
        checkedBy: manual



sourceFiles:
  - platform: web-component
    file: ../../../site/components/cross-refs.js

imports:
  - platform: web-component
    code: |
      <ds-cross-refs>
        See also: <a href="#ref">Ref</a>, <a href="#combo">Combo</a>
      </ds-cross-refs>

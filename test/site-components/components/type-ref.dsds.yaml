kind: component
id: type-ref
name: TypeRef
description: An inline, monospace link to another schema definition — used inside a property's type text or description to cross-reference another definition on the Schema page.

metadata:
  tags: [schema-reference, navigation]
  status: {status: stable}

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - level: should
        statement: Use inline, within a property's type text or a description, to cross-reference another schema definition. For a list of related definitions below a description, use cross-refs instead — it's built for a group of links, not one inline reference.
        alternatives:
          - to: cross-refs
        checkedBy: manual

  - kind: guidelines
    for: agent
    items:
      - level: must
        statement: Rendering waits for DOMContentLoaded when the document is still loading, since the link text is read from this element's own light-DOM textContent — a single requestAnimationFrame tick is not a reliable guarantee that light-DOM children have finished parsing.
        checkedBy: manual



sourceFiles:
  - platform: web-component
    file: ../../../site/components/type-ref.js

imports:
  - platform: web-component
    code: <ds-type-ref href="#ref">Ref</ds-type-ref>

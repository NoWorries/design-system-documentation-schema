kind: component
id: badge
name: Badge
description: A small chip with a color-coded icon block, used for kind/status/experimental labels. The icon is decorative — the variant's meaning is redundant with the visible label text next to it.

metadata:
  tags: [labels, status]
  status: {status: stable}

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - level: should
        statement: Use to label an entry's kind, status, or experimental state (the roles its three variants exist for). For a plain keyword or category label with no built-in meaning, use tag instead.
        alternatives:
          - to: tag
        checkedBy: manual

  - kind: guidelines
    for: all
    items:
      - level: must
        statement: The variant icon is decorative and MUST stay aria-hidden — its meaning is always paired with adjacent visible text, never conveyed by color/icon alone.
        checks:
          - href: ../../../scripts/checks/axe-audit.mjs
            role: test
        checkedBy: automated



sourceFiles:
  - platform: web-component
    file: ../../../site/components/badge.js

imports:
  - platform: web-component
    code: <ds-badge variant="experimental">Experimental</ds-badge>

traits:
  - traitType: variant
    kind: enum
    id: variant
    description: Which icon and accent color to show.
    values:
      - id: neutral
        description: Default chip — a dot icon on the accent color.
      - id: kind
        description: Used by def-section's type badge — an info icon on the text color.
      - id: experimental
        description: Used by prop-list's "at least one" conditional marker — a flask icon on the warning color.

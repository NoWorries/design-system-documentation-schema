kind: component
id: logo
name: Logo
description: The DSDS mark, fetched from site/assets/dsds.svg and inlined so its fill can be recolored at runtime.

metadata:
  tags: [branding]
  status: {status: stable}

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - level: should
        statement: Use only for the DSDS mark itself — nav branding, footer, a standalone "powered by" credit. Not a generic icon component; it always renders the one fixed SVG at site/assets/dsds.svg.
        checkedBy: manual

  - kind: guidelines
    for: all
    items:
      - level: must
        statement: Omit the label attribute when the logo sits next to visible text that already names it (the default — decorative, aria-hidden). Set label only when the logo is used standalone, with no adjacent text.
        checks:
          - href: ../../../scripts/checks/axe-audit.mjs
            role: test
        checkedBy: automated
      - level: must-not
        statement: Edit site/assets/dsds.svg directly to change the mark — this component only loads and recolors whatever's there; it does not own the artwork.
        checkedBy: manual



sourceFiles:
  - platform: web-component
    file: ../../../site/components/logo.js

imports:
  - platform: web-component
    code: <ds-logo size="24px" fill="#fff" background="#0055b3"></ds-logo>

kind: component
id: heading
name: Heading
description: An anchored heading — renders the requested heading level with a stable, deep-linkable id, derived from its text content unless one is given explicitly.

metadata:
  tags: [content, navigation]
  status: {status: stable}

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - level: should
        statement: Use for real document structure below the page's own h1. Not a font-size shortcut — if the goal is only larger or bolder text with no actual section boundary, that is a styling need, not a heading.
        checkedBy: manual

  - kind: guidelines
    for: all
    items:
      - level: must
        statement: Levels MUST NOT skip — e.g. an h2 section's first child heading MUST be h3, never h4, so the page's heading outline stays navigable by assistive-technology heading-jump commands.
        checks:
          - href: ../../../scripts/checks/axe-audit.mjs
            role: test
        checkedBy: automated
      - level: should
        statement: Prefer the default anchor (derived from text content) — set anchor explicitly only when two headings on the same page would otherwise collide, or when a stable, pre-existing deep link needs to survive a heading text edit.
        checkedBy: manual

sourceFiles:
  - platform: web-component
    file: ../../../site/components/heading.js

imports:
  - platform: web-component
    code: <ds-heading level="3">Conformance classes</ds-heading>

traits:
  - traitType: variant
    kind: enum
    id: level
    name: Level
    description: Which native heading level (h1–h6) to render.
    values:
      - id: "1"
        description: Page title. Reserved for ds-header's own h1 — a page should have exactly one.
      - id: "2"
        name: "2 (default)"
        description: Top-level section heading.
      - id: "3"
        description: Sub-section heading.
      - id: "4"
        description: Nested sub-section heading.
      - id: "5"
        description: Rarely used — most pages don't nest this deep.
      - id: "6"
        description: Rarely used — most pages don't nest this deep.

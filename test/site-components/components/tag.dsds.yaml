kind: component
id: tag
name: Tag
description: A pill-shaped tag for keyword and category labels.

metadata:
  tags: [labels, content]
  status: {status: stable}

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - level: should
        statement: Use for a plain keyword or category label with no built-in meaning of its own (e.g. "actions", "layout"). Once a label needs to convey kind, status, or an experimental flag, use badge instead — it carries that meaning in its icon and color.
        alternatives:
          - to: badge
        checkedBy: manual

  - kind: guidelines
    for: all
    items:
      - level: should
        statement: Label text SHOULD stay short — the tag truncates with an ellipsis rather than wrapping once it exceeds its container's width.
        checkedBy: manual

sourceFiles:
  - platform: web-component
    file: ../../../site/components/tag.js

imports:
  - platform: web-component
    code: <ds-tag>color</ds-tag>

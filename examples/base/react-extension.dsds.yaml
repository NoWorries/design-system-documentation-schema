# Demonstrates multi-file composition: upstream let entityGroups.nodes[]
# items be "inline or a $ref to another file" - a per-entry union type just
# for this case. Here, this document is its own entry in the graph; it
# points at the document that owns the entries it builds on via an
# ordinary `refs` entry (rel: file), the same pointer type used
# everywhere else.
schemaVersion: "0.21.2"

name: Acme Design System

entries:
  - kind: component
    id: icon-button
    name: Icon Button
    description: A button variant that renders a single icon with no visible label.
    metadata:
      status: {status: stable}
    sections:
      - kind: guidelines
        for: all
        framing: when-to-use
        items:
          - level: should
            statement: Use when space is tight and the icon is widely recognized on its own.
            alternatives:
              - to: button
                rel: alternative-to

      - kind: guidelines
        for: all
        items:
          - level: must
            statement: Icon button MUST carry an aria-label, since it has no visible text label.
            # assisted: axe's button-name rule flags a missing accessible name.
            checkedBy: assisted
    refs:
      - to: button
        rel: part-of
      - to: color.action.primary
        rel: depends-on

refs:
  - href: ./starter-kit.dsds.yaml
    rel: file
    role: core

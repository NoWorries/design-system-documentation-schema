kind: component
id: button-group
name: Button Group
description: A set of related buttons laid out together, sharing consistent spacing and alignment.

metadata:
  tags: [actions, layout]
  since: 1.1.0
  status: {status: stable}

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    items:
      - level: should
        statement: Limit to actions a user is choosing between, not an unrelated toolbar of controls.
      - level: should-not
        statement: Don't wrap a single action in a group - a lone action is just a button.
        alternatives:
          - to: button
            rel: alternative-to

  - kind: guidelines
    for: all
    items:
      - level: may
        statement: Order buttons by how often each action is taken, most frequent first, unless a platform convention dictates otherwise.

refs:
  - to: button
    rel: composes

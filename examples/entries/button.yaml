kind: component
id: button
name: Button
description: An interactive element that triggers an action when activated.
metadata:
  updated: {date: 2026-06-02}
  tags: [actions, button, cta, form-control]
  since: 1.4.0
  status: {status: stable}
  aliases: [btn]

sections:
  - kind: guidelines
    for: agent
    framing: when-to-use
    items:
      - level: must-not
        statement: Do not use button when the action navigates to a new URL; use the link entry instead.
        alternatives:
          - to: link
            rel: alternative-to
        checkedBy: manual

  - kind: guidelines
    for: human
    items:
      - level: must
        statement: Use buttons only for in-page actions, never navigation.
        checkedBy: manual
      # No statement here - this requirement is owned and tracked in the
      # team's own requirements system, not restated in this document. See
      # guidelines.schema.yaml's own $comment for why external-link
      # exempts statement the same way same-as does.
      - level: must
        checkedBy: manual
        refs:
          - href: https://example.atlassian.net/browse/DS-482
            rel: external-link
      - level: should
        statement: Limit each surface to one primary button.
        example:
          title: One primary action per surface
          showcase:
            kind: image
            url: https://cdn.acme.example/ds/showcase/button-primary-surface.png
            alt: A toolbar with one filled primary button and two lower-emphasis secondary buttons.
        # A guideline item's own fields are closed - not extensible the way
        # an entry or a section is - so $extensions is the one way to
        # attach org-specific data (here, a rationale and a failure mode)
        # to a single rule without forking the guidelines kind itself.
        $extensions:
          com.acme:
            rationale: Multiple primary buttons compete for attention and force the user to guess which action is actually the recommended one.
            failureMode: A dialog ships with two primary-styled buttons (e.g. "Save" and "Save as draft"), and usability testing shows users default to the wrong one.

  # Every item here carries the `accessibility` tag, which makes this a
  # tag-scoped section: narrowest, so it follows every how-to-use section
  # above it whatever their `for` is. `for: all` after `for: human` is not
  # an audience inversion, because audience only sorts within one tier.
  - kind: guidelines
    for: all
    title: Accessibility
    tags: [accessibility]
    items:
      - level: must
        statement: Give an icon-only button an accessible name that matches its visible tooltip.
        checks:
          - href: ./tests/button.a11y.test.ts
            rel: test
            role: vitest + axe-core
        checkedBy: automated
        tags: [accessibility, naming]
      - level: must
        statement: Keep the focus indicator visible when the button is focused by keyboard.
        checkedBy: assisted
        tags: [accessibility, focus]
      - level: should-not
        statement: Do not remove the button from the tab order to make it decorative.
        checkedBy: manual
        tags: [accessibility, focus]

  - kind: definitions
    for: all
    context: terms
    items:
      - term: OK
        definition: To confirm an action.
      - term: Cancel
        definition: To cancel an action.

  - kind: steps
    for: agent
    ordered: false
    title: Pre-release checklist
    items:
      - title: Focus ring is visible in both light and dark themes.
      - title: Loading state announces to screen readers.
      - optional: true
        title: Works with a custom icon in the leading-icon slot.

refs:
  - to: button-group
    rel: part-of
  - to: icon-button
    rel: alternative-to
  - to: link
    rel: alternative-to
  - to: color.action.primary
    rel: depends-on
  - href: https://github.com/org/ds/react/button
    rel: source
  - href: https://storybook.org/ds/button
    rel: storybook
    role: hosted docs
  - href: ./stories/button.stories.tsx
    rel: storybook
    role: CSF story source
    note: Component Story Format (CSF3) - the source the hosted docs above are built from.
  - href: npm:@org/ds-react
    rel: package

# A tool extracts the full interface (variant/size/disabled/loading/
# onClick/fullWidth) straight from this file - JSDoc/TSDoc in the code
# itself, not hand-typed here.
sourceFiles:
  - platform: react
    file: ./src/Button.tsx

specs:
  - href: ./contracts/button.contract.json
    rel: contract
    role: DS Contracts

# One field for every way the button varies: configuration the consumer
# chooses (boolean, enum) and conditions that happen at runtime (also
# boolean - `description` says which).
traits:
  - traitType: state
    kind: boolean
    id: loading
    description: Shows a spinner in place of the label and blocks interaction while active.
    purpose: Prevents duplicate submissions while an action is in flight.
  - traitType: variant
    kind: enum
    id: size
    description: Controls the button's overall scale.
    values:
      - id: small
        description: Compact size for dense layouts (e.g. toolbars).
      - id: medium
        description: The default size for most surfaces.
      - id: large
        description: Larger touch target for primary calls-to-action.
  - traitType: variant
    kind: enum
    id: variant
    description: Which visual style to render.
    values:
      - id: primary
        description: The default, high-emphasis style for the main action on a surface.
      - id: secondary
        description: Lower-emphasis alternative for secondary actions alongside a primary button.
      - id: danger
        description: Destructive actions only (delete, revoke access, etc.).
  # hover, loading and disabled are all states, but only hover happens on its
  # own - the other two are turned on by the caller. `traitType` says what a
  # trait is, not who switches it.
  - traitType: state
    kind: boolean
    id: hover
    description: Background darkens slightly when the pointer is over the button.
  - traitType: state
    kind: boolean
    id: disabled
    description: Dimmed and non-interactive; triggered by the `disabled` prop.
combos:
  - subject: loading
    level: must-not
    items: [disabled]
    note: A control can't be simultaneously loading and disabled - loading already blocks interaction, and layering both muddles what the button will do when the work finishes.
  - subject: size.small
    level: must-not
    items: [variant.danger]
    note: Destructive actions need the full-size touch target; a small danger button invites mis-taps on the most costly action.

$extensions:
  com.figma:
    displayName: "Button/Primary"
    nodeId: "12:4045"

kind: entry
# Was previously modeled as its own "chunk" node kind, with a bespoke
# data.code form (inline {code, language} or referenced {src, language}).
# Both turned out to duplicate things this spec already has: inline code
# is exactly common/showcase.schema.yaml's `code` variant
# (metadata.preview would use it), and a reference to an external file is
# exactly a `refs` entry (rel: file) - the same trick a token uses to
# point at its DTCG file. What's left - `uses` (since this
# is built from other components), a status, and some sections - is just a
# pattern.
id: confirmation-dialog
name: Confirmation Dialog
description: A pre-composed destructive-action confirmation, built from Dialog, Button, and Icon.

metadata:
  status: {status: stable}

sections:
  - kind: guidelines
    for: all
    framing: when-to-use
    title: When to use
    items:
      - level: should
        statement: Confirming a destructive, hard-to-reverse action (delete, revoke access).
      - level: should-not
        statement: Confirming a routine save or submit action.
        alternatives:
          - to: button
            note: A routine action doesn't need an interruption; a plain button keeps the flow moving.

uses:
  - to: dialog
  - to: button
  - to: icon
refs:
  - href: ./chunks/confirmation-dialog.tsx
    rel: source
    role: React implementation
